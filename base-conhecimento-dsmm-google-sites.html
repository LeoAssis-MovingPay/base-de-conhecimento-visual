<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base de Conhecimento DSMM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Versão enxuta: só o fluxo (esquerda) e a explicação da etapa (direita). Mesmo visual do vídeo. */
:root{
  --bg:#101016; --bg-alt:#17171f; --card:#1f1f29; --line:rgba(255,255,255,.10);
  --text:#f2f2f5; --dim:#a1a1b0; --faint:#6b6b7a; --hero:#3dd68c; --ia:#8b7cf6;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:30px 30px}
.wrap{max-width:1080px;margin:0 auto;padding:40px 28px 36px}
h1,h2{font-family:var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.eyebrow b{color:var(--hero);font-weight:500}
:focus-visible{outline:2px solid var(--hero);outline-offset:3px;border-radius:8px}

header{margin-bottom:28px}
header h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin:10px 0 8px}
header h1 em{font-style:normal;color:var(--hero)}
header p{color:var(--dim);font-size:18px}

.flow{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px}
.chart{padding:14px}
.chart svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node rect{fill:var(--bg-alt);stroke:rgba(255,255,255,.16);stroke-width:1.2;transition:stroke .2s,fill .2s}
.node:hover rect{stroke:rgba(255,255,255,.4)}
.node .n{fill:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.node .t{fill:var(--text);font-family:var(--display);font-weight:700;font-size:15px}
.node.on rect{stroke:var(--hero);stroke-width:2;fill:#15241d}
.node.on .n{fill:var(--hero)}
.node.ia.on rect{stroke:var(--ia);fill:#1d1a33}
.node.ia.on .n{fill:var(--ia)}
.edge{fill:none;stroke:rgba(255,255,255,.18);stroke-width:1.6;transition:stroke .3s}
.edge.on{stroke:var(--hero)}
.edge.dash{stroke-dasharray:5 5}
.elabel{fill:var(--faint);font-family:var(--mono);font-size:10px}
.dot{fill:var(--text)}

.steps{display:grid;gap:8px}
.step{padding:15px 20px;cursor:pointer;border:1px solid var(--line);border-radius:14px;background:transparent;transition:background .2s,border-color .2s}
.step:hover{border-color:rgba(255,255,255,.22)}
.step .row{display:flex;align-items:baseline;gap:12px}
.step .num{font-family:var(--mono);font-size:12px;color:var(--faint)}
.step h2{font-size:19px;font-weight:500;color:var(--dim)}
.step .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}
.step .body>div{overflow:hidden}
.step p{color:#c4c4cf;font-size:16.5px;line-height:1.6;padding-top:10px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 4px}
.chips span{font-family:var(--mono);font-size:12px;color:var(--dim);background:var(--bg-alt);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.step.on .chips span:first-child{color:var(--hero);border-color:rgba(61,214,140,.35)}
.step.ia.on .chips span:first-child{color:var(--ia);border-color:rgba(139,124,246,.4)}
.step.on{background:var(--card);border-color:var(--hero)}
.step.on .num{color:var(--hero)}
.step.on h2{color:var(--text);font-weight:700}
.step.on .body{grid-template-rows:1fr}
.step.ia.on{border-color:var(--ia)}
.step.ia.on .num{color:var(--ia)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}
.nav span{font-size:13px;color:var(--faint)}
.nav div{display:flex;gap:8px}
.nav button{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.nav button:hover{border-color:rgba(255,255,255,.3)}
.nav button:disabled{opacity:.4;cursor:default}

footer{margin-top:30px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
footer p{font-family:var(--display);font-weight:700;font-size:20px}
footer p em{font-style:normal;color:var(--hero)}

@media (max-width:820px){.flow{grid-template-columns:1fr}.chart{max-width:460px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow"><b>Automação n8n</b> · MovingPay</span>
    <h1>Base de Conhecimento <em>DSMM</em></h1>
    <p>Todo chamado agrega no próximo.</p>
  </header>

  <div class="flow">
    <div class="panel chart">
      <svg id="chart" viewBox="0 0 420 790" role="img" aria-label="Fluxo da automação, do Jira à publicação da nota"></svg>
    </div>
    <div>
      <div class="steps" id="steps"></div>
      <div class="nav">
        <span>Clique numa etapa ou use as setas ↑ ↓</span>
        <div><button type="button" id="prev">Anterior</button><button type="button" id="next">Próxima</button></div>
      </div>
    </div>
  </div>

  <footer>
    <p>Todo chamado resolvido deixa o próximo <em>mais rápido.</em></p>
    <span class="eyebrow">Jira · GitHub · Gemini · Slack · Obsidian</span>
  </footer>
</div>

<script>
const STEPS = [
  { tag:"Entrada", node:"Jira", title:"Busca os chamados concluídos",
    text:"A cada 10 minutos, o n8n procura no Jira os DSMMs que foram para Concluído ou Fechada e ainda não viraram nota. Cada ticket recebe uma marcação para não ser processado duas vezes.",
    chips:["Bug, História e Tarefa", "um ticket por vez"] },
  { tag:"Contexto", node:"Ticket e comentários", title:"Lê o ticket e os comentários",
    text:"A descrição mostra o sintoma e como reproduzir. Os comentários costumam trazer a causa, a correção e a validação em produção. Antes de seguir, CPF, CNPJ, cartão, e-mail e tokens são mascarados.",
    chips:["sem comentários, não gera nota"] },
  { tag:"Código", node:"GitHub", title:"Encontra o Pull Request",
    text:"O fluxo procura o PR da correção pelo número do DSMM ou pelo link citado nos comentários. Os arquivos alterados ajudam a IA a explicar a causa com precisão.",
    chips:["link do PR vai para a nota"] },
  { tag:"Referência", node:"Base de conhecimento", title:"Consulta a base de conhecimento",
    text:"Lê as notas do módulo envolvido na nossa base técnica, as mesmas do Obsidian, para explicar o contexto do sistema. Também procura notas DSMM de problemas parecidos que já existem.",
    chips:["documentação do módulo", "casos parecidos"] },
  { tag:"Escrita", node:"IA (Gemini)", title:"A IA escreve a nota", ia:true,
    text:"Com tudo isso, a IA decide se é um problema novo ou repetido. Novo: escreve a nota com resumo, contexto, sintoma, causa raiz, solução e como validar. Repetido: acrescenta uma ocorrência na nota existente.",
    chips:["1 chamada por ticket", "não inventa o que não está no ticket"] },
  { tag:"Revisão", node:"Slack", title:"O dev revisa no Slack",
    text:"O responsável pelo ticket recebe a prévia da nota no Slack. Ele aprova, pede ajuste com um comentário (a IA reescreve) ou rejeita.",
    chips:["sem resposta em 48h, avisa o tech lead"] },
  { tag:"Publicação", node:"Publica", title:"Publica na base",
    text:"A nota aprovada vai para o repositório com o nome do problema, aparece no Obsidian e o link volta como comentário no ticket do Jira. Na próxima vez, quem fizer a triagem já encontra o histórico.",
    chips:["GitHub", "Obsidian", "link no Jira"] },
];

// ---- diagrama ----
const svg = document.getElementById("chart"), NS = "http://www.w3.org/2000/svg";
const X = 100, W = 220, H = 64, GAP = 106, Y0 = 20;
const pos = STEPS.map((_, i) => ({ x: X, y: Y0 + i * GAP }));
const el = (t, a, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const edges = [];
for (let i = 0; i < STEPS.length - 1; i++)
  edges.push(el("path", { class: "edge", d: `M${X + W / 2} ${pos[i].y + H} L${X + W / 2} ${pos[i + 1].y}` }));
const iaY = pos[4].y + H / 2, slY = pos[5].y + H / 2;
el("path", { class: "edge dash", d: `M${X + W} ${slY} C ${X + W + 64} ${slY}, ${X + W + 64} ${iaY}, ${X + W} ${iaY}` });
el("text", { class: "elabel", x: X + W + 40, y: (iaY + slY) / 2 + 4 }).textContent = "AJUSTE";
const last = pos[pos.length - 1];
el("path", { class: "edge", d: `M${X + W / 2} ${last.y + H} L${X + W / 2} ${last.y + H + 20}` });
el("circle", { class: "dot", cx: X + W / 2, cy: last.y + H + 26, r: 5 });
const runner = el("circle", { class: "dot", r: 4, cx: X + W / 2, cy: Y0 + H / 2 });

const nodes = STEPS.map((s, i) => {
  const g = el("g", { class: "node" + (s.ia ? " ia" : ""), tabindex: "0", role: "button", "aria-label": s.title });
  el("rect", { x: X, y: pos[i].y, width: W, height: H, rx: 14 }, g);
  el("text", { class: "n", x: X + 16, y: pos[i].y + 23 }, g).textContent = `${String(i + 1).padStart(2, "0")} ${s.tag.toUpperCase()}`;
  el("text", { class: "t", x: X + 16, y: pos[i].y + 46 }, g).textContent = s.node;
  g.addEventListener("click", () => select(i));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i); } });
  return g;
});

// ---- explicações ----
const box = document.getElementById("steps");
const cards = STEPS.map((s, i) => {
  const d = document.createElement("div");
  d.className = "step" + (s.ia ? " ia" : "");
  d.tabIndex = 0;
  d.innerHTML = `<div class="row"><span class="num">${String(i + 1).padStart(2, "0")}</span><h2>${s.title}</h2></div><div class="body"><div><p>${s.text}</p><div class="chips">${(s.chips||[]).map(c=>`<span>${c}</span>`).join("")}</div></div></div>`;
  d.addEventListener("click", () => select(i));
  d.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i); } });
  box.appendChild(d);
  return d;
});
const prev = document.getElementById("prev"), next = document.getElementById("next");
prev.onclick = () => select(cur - 1); next.onclick = () => select(cur + 1);

let cur = 0, anim = null;
function select(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i)); cur = i;
  nodes.forEach((n, k) => n.classList.toggle("on", k === i));
  cards.forEach((c, k) => c.classList.toggle("on", k === i));
  edges.forEach((e, k) => e.classList.toggle("on", k < i));
  prev.disabled = i === 0; next.disabled = i === STEPS.length - 1;
  const to = pos[i].y + H / 2, from = +runner.getAttribute("cy"), t0 = performance.now();
  cancelAnimationFrame(anim);
  const step = t => { const p = Math.min(1, (t - t0) / 450), e = 1 - Math.pow(1 - p, 3);
    runner.setAttribute("cy", from + (to - from) * e); if (p < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); select(cur + 1); }
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); select(cur - 1); }
});
select(0);
</script>
</body>
</html>
